<form #formGroup="ngForm" (ngSubmit)="submit()">
    <div class="form-group">
        <label for="name">Name</label>
        <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            required
            [(ngModel)]="newItemName"
            #name="ngModel"
        />
    </div>
    <div *ngIf="name.invalid && name.dirty" class="alert alert-danger">
        Name is required
    </div>
    <button mat-flat-button [disabled]="!formGroup.form.valid" type="submit">
        Add new {{ itemType }}
    </button>
</form>
