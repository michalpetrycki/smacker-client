<div
    class="recipes-grid"
    infiniteScroll
    [infiniteScrollDistance]="2"
    [infiniteScrollThrottle]="150"
    (scrolled)="loadMore()"
>
    <div
        class="recipe-card"
        *ngFor="let recipe of recipes"
        [routerLink]="['/przepis', recipe.id]"
    >
        <img [src]="recipe.image" [alt]="recipe.title" />
        <h3>{{ recipe.title }}</h3>
        <p>{{ recipe.description }}</p>
        <span>{{ recipe.kcal }} kcal / 100g</span>
    </div>
</div>

<div *ngIf="loading" class="loading-spinner" Loading...></div>
<div *ngIf="noMoreData" class="end-message">That's all doc!</div>
